<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Browser prototype for Ashmeet Singh's Next.js 14 portfolio redesign."
    />
    <title>Ashmeet Portfolio Redesign - Next14 Browser Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-ui="shell">
      <nav class="nav" aria-label="Primary navigation">
        <a class="brand" href="#home" aria-label="Ashmeet Singh home">
          <span class="brand-mark" aria-hidden="true">A</span>
          <span>Ashmeet Singh</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="navLinks">
          <span class="sr-only">Toggle navigation</span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
          <span aria-hidden="true"></span>
        </button>

        <div class="nav-links" id="navLinks">
          <a href="#home" data-route="home">Home</a>
          <a href="#about" data-route="about">About</a>
          <a href="#projects" data-route="projects">Projects</a>
          <a href="#resume" data-route="resume">Resume</a>
          <a href="#certifications" data-route="certifications">Certifications</a>
          <a href="#contact" data-route="contact">Contact</a>
        </div>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <div id="app" aria-live="polite"></div>
    </main>

    <div class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

    <script src="./script.js"></script>
  </body>
</html>
